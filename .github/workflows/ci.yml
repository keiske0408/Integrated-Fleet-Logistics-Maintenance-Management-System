name: Frontend CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Code Duplication Check (jscpd)
        run: npm run lint:dup

      - name: Unused Code Analysis (knip)
        run: npm run lint:unused

      - name: ESLint
        run: npm run lint

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Vitest Unit & Integration Tests
        run: npm test

      - name: Production Vite Build Verification
        run: npm run build
