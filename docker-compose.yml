services:
  db:
    image: postgres:16-alpine
    container_name: fleet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleetpassword
      POSTGRES_DB: FleetDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d FleetDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../fleet-backend
      dockerfile: Dockerfile
    container_name: fleet_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://fleet:fleetpassword@db:5432/FleetDB
      FRONTEND_ORIGIN: http://localhost
      JWT_SECRET: production-fleet-jwt-secret-replace-in-env
      ALLOW_DEV_HEADER_AUTH: "false"
    ports:
      - "3001:3001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
