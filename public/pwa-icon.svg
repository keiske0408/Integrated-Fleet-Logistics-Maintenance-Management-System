<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#090d16" stroke="#1e293b" stroke-width="12"/>
  <!-- Gauge Arc -->
  <path d="M 120 330 A 160 160 0 1 1 392 330" fill="none" stroke="#1e293b" stroke-width="32" stroke-linecap="round"/>
  <path d="M 120 330 A 160 160 0 1 1 360 210" fill="none" stroke="url(#grad)" stroke-width="32" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Needle & Center Pivot -->
  <circle cx="256" cy="270" r="32" fill="#3b82f6" />
  <line x1="256" y1="270" x2="330" y2="180" stroke="#60a5fa" stroke-width="16" stroke-linecap="round"/>
  <!-- Text Label -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">HULMA</text>
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">DRIVER</text>
</svg>
